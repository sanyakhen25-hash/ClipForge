name: Build ClipForge installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item (Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe

      - name: Install Python packages
        run: python -m pip install --upgrade pip pyinstaller yt-dlp numpy faster-whisper

      - name: Build the app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name ClipForge --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all yt_dlp clipforge_app.py
          Copy-Item ffmpeg.exe dist\ClipForge\

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build the installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Setup
          path: installer/ClipForge-Setup.exe
